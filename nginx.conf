# 🔥 SIÊU CẤU HÌNH NGINX CHO PIXELFED (OPTIMIZED FOR RAILWAY & CLOUDFLARE)

# 1. Tối ưu hóa kết nối (Network Layer)
sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;
types_hash_max_size 2048;
client_max_body_size 100M; # Cho phép upload ảnh/video dung lượng lớn

# 2. Nén dữ liệu (Gzip) - Giúp tải trang cực nhanh
gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# 3. Cấu hình Server chính
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /var/www/html/public; # PixelFed chạy từ thư mục public
    index index.php;

    # Bảo mật Headers chuẩn A+
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # 🔥 BÍ QUYẾT TỐC ĐỘ: Browser Caching cho Hình ảnh & Media
    # Ép trình duyệt lưu ảnh 1 năm, không hỏi lại Server
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|webp|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Tối ưu hóa CSS và JS (Lưu 1 tháng)
    location ~* \.(?:css|js)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Xử lý các yêu cầu chính qua Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cấu hình PHP-FPM (Kết nối với PHP 8.4 bên trong Image)
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Tăng tốc độ phản hồi PHP
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        
        # Tối ưu cho Cloudflare
        fastcgi_read_timeout 300;
    }

    # Chống truy cập file ẩn
    location ~ /\. {
        deny all;
    }
}
